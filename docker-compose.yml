services:
  node-gateway:
    build: ./node-gateway
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - python-detection

  python-detection:
    build: ./python-detection
    ports:
      - "8000:8000"
    env_file:
      - .env

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongo_data:
  ollama_data:
